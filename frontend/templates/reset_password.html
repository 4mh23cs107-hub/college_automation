{% extends 'base.html' %}
{% block title %}Reset Account Password{% endblock %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
  <div class="card" style="width: 100%; max-width: 460px;">
    <div style="margin-bottom: 28px;">
      <p class="eyebrow">Account Security</p>
      <h1 style="font-size: 2em; color: #333; margin-bottom: 8px;">Reset password</h1>
      <p>Set a new password for an existing account.</p>
    </div>

    <form method="post">
      <div class="form-group">
        <label for="username">Account username</label>
        <input id="username" type="text" name="username" placeholder="Enter username or student USN" required />
      </div>

      <div class="form-group">
        <label for="password">New password</label>
        <div class="password-input-wrap">
          <input id="password" type="password" name="password" placeholder="At least 8 characters" minlength="8" required />
          <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" title="Show password">&#128065;</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmation">Confirm new password</label>
        <div class="password-input-wrap">
          <input id="confirmation" type="password" name="confirmation" placeholder="Repeat the new password" minlength="8" required />
          <button type="button" class="password-toggle" data-password-toggle="confirmation" aria-label="Show password" title="Show password">&#128065;</button>
        </div>
      </div>

      <button type="submit" style="width: 100%; padding: 12px;">Reset password</button>
    </form>
  </div>
</div>
{% endblock %}
